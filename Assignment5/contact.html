<!DOCTYPE html>
<html lang="en">
<html>
    <head>
       <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <title>Madison Daggett Art Page</title>
        <link rel="stylesheet" href="styles/styles.css">
    </head>
<body>

<div class="header">
    <img class="header-logo" src="images/logo.png">
    <img class="header-image" src="images/madison.png">
    <img class="header-logo" src="images/logo.png">
</div>

<nav class="navbar">
        <a href="https://www.instagram.com/maddimoxxiart/" class="nav-button">
            <img src="images/icons/Insta.png" alt="Instagram icon">
        </a>
        <a href="contact.html" class="nav-button">
            <img src="images/icons/contact.png" alt="Email icon">
        </a>
        <a href="index.html" class="nav-button">
            <img src="images/icons/Home.png" alt="Home icon">
        </a>
</nav>

<br>
<br>

<form class="contactform">
    <div class="h2-div contact-image-container">
        <img src="images/icons/Cloud.png" alt="cloud image">
        <div class="text-overlay">
            <h2 class="gluten-regular">
                Contact Me!
            </h2>
        </div>
    </div>
    <p class="contact-description indie-flower-regular">Feel free to reach out to me with any questions or opportunities! Leave your name, email, and message below and I will get back to you as soon as possible.
    </p>
    <form action="/contact" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
    </form>
<br>
<footer>
    <p>&copy 2026 Madison Daggett. All rights reserved.</p>
</footer>
</body>
</html>
