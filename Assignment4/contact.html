<form class="contactform">
    <div class="h2-div contact-image-container">
        <img src="images/Cloud.png" alt="cloud image">
        <div class="text-overlay">
            <h2 class="gluten-regular">
                Contact Me!
            </h2>
        </div>
    </div>
    <p class="contact-description indie-flower-regular">
        Feel free to reach out to me with any questions or opportunities! Leave your name, email, and message below and I will get back to you as soon as possible.
    </p>
    <form action="/contact" method="post">
        <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send Message</button>
</form>
