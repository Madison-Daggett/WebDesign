
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Grid with Hover Overlay</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    max-width: 1200px;
    margin: 30px auto;
}

.image-box {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
}

.image-box img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}

/* Overlay */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease;
}

/* Hover effect */
.image-box:hover .overlay {
    opacity: 1;
}

.image-box:hover img {
    transform: scale(1.1);
}

.overlay h2 {
    margin: 0 0 10px;
    font-size: 24px;
}

.overlay p {
    margin: 0;
    font-size: 15px;
    padding: 0 15px;
}

/* Keyboard accessibility */
.image-box:focus-visible {
    outline: 3px solid #2878ff;
    outline-offset: 3px;
}

.image-box:focus-visible .overlay {
    opacity: 1;
}
</style>
</head>

<body>

<h1>Image Gallery</h1>

<div class="image-grid">

    <div class="image-box" tabindex="0">
        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
        <div class="overlay">
            <h2>Mountains</h2>
            <p>Explore beautiful mountain views</p>
        </div>
    </div>

    <div class="image-box" tabindex="0">
        <img src="https://picsum.photos/id/1016/600/400" alt="Nature landscape">
        <div class="overlay">
            <h2>Nature</h2>
            <p>Discover the beauty of nature</p>
        </div>
    </div>

    <div class="image-box" tabindex="0">
        <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
        <div class="overlay">
            <h2>Landscape</h2>
            <p>Enjoy amazing landscapes</p>
        </div>
    </div>

    <div class="image-box" tabindex="0">
        <img src="https://picsum.photos/id/1020/600/400" alt="Forest">
        <div class="overlay">
            <h2>Forest</h2>
            <p>Experience peaceful forests</p>
        </div>
    </div>

</div>

</body>
</html>
